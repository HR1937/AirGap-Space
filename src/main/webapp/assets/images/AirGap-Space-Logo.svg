<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Clock Dial Background -->
    <radialGradient id="clockBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ring Metallic Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. MAIN CLOCK DIAL (PERFECTLY CENTERED)    -->
  <!-- ========================================== -->
  <circle cx="256" cy="256" r="230" fill="url(#clockBg)"/>

  <!-- ========================================== -->
  <!-- 2. AIR GAP RING (PHYSICAL BREAK AT TOP-RIGHT) -->
  <!-- ========================================== -->
  <path d="M 453 221 A 200 200 0 1 1 356 83" 
        fill="none" 
        stroke="url(#ringGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        filter="url(#neon)"/>

  <!-- AirGap Break Endpoint Nodes -->
  <circle cx="453" cy="221" r="6" fill="#00f2fe" filter="url(#neon)"/>
  <circle cx="356" cy="83" r="6" fill="#00f2fe" filter="url(#neon)"/>

  <!-- Hour Ticks (12, 3, 6, 9 o'clock) -->
  <line x1="256" y1="76" x2="256" y2="94" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="418" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="418" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="76" y1="256" x2="94" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- 3. OCEAN STUDY WAVES (BACKGROUND)          -->
  <!-- ========================================== -->
  <path d="M 120 350 Q 180 335 240 350 T 360 350" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150 380 Q 220 365 290 380 T 410 380" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- 4. ASCENDING KNOWLEDGE BOAT & LARGE PERSON -->
  <!-- ========================================== -->
  <!-- Trajectory Path pointing out through the AirGap -->
  <line x1="210" y1="300" x2="385" y2="125" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Boat & Person Group (Angled 38deg upward) -->
  <g transform="translate(325, 165) rotate(-38)">
    
    <!-- A. SAIL SHIFTED TO REAR (x = -20) TO AVOID OVERSHADOWING PERSON -->
    <path d="M -25,-8 C -42,-38 -25,-70 -20,-78 C -15,-70 0,-38 -15,-8 Z" fill="#00f2fe" opacity="0.85" filter="url(#neon)"/>
    <line x1="-20" y1="-78" x2="-20" y2="-8" stroke="#ffffff" stroke-width="2.5"/>

    <!-- B. PAPER BOOK BOAT HULL -->
    <polygon points="-60,14 0,38 60,14 42,-8 -42,-8" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" filter="url(#neon)"/>
    <!-- Folded Hull Facets -->
    <polygon points="-60,14 0,38 0,-8" fill="#cbd5e1"/>
    <polygon points="60,14 0,38 0,-8" fill="#e2e8f0"/>

    <!-- C. LARGE, PROMINENT HUMAN SILHOUETTE (PROPORTIONALLY 2X BIGGER) -->
    <!-- Head -->
    <circle cx="18" cy="-44" r="11" fill="#ffffff" filter="url(#neon)"/>
    
    <!-- Torso / Leaning forward -->
    <path d="M 8,-8 C 6,-24 12,-32 18,-32 C 24,-32 28,-22 22,-8 Z" fill="#ffffff"/>
    
    <!-- Forward Steering Arm -->
    <path d="M 18,-26 L 38,-18 L 32,-11 Z" fill="#ffffff"/>
    
    <!-- Oar / Staff going into water -->
    <line x1="12" y1="-20" x2="42" y2="24" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
  </g>

  <!-- ========================================== -->
  <!-- 5. TIME 19:37 HANDS (EXACT 222° AND 228.5°) -->
  <!-- ========================================== -->
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#0f172a" stroke="#f8fafc" stroke-width="4"/>

  <!-- Minute Hand: 37 Minutes = 222 degrees (Points to (162, 360)) -->
  <line x1="256" y1="256" x2="162" y2="360" 
        stroke="url(#cyanGlow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#neon)"/>

  <!-- Hour Hand: 19:37 / 7:37 = 228.5 degrees (Points to (185, 319)) -->
  <line x1="256" y1="256" x2="185" y2="319" 
        stroke="#f8fafc" 
        stroke-width="10" 
        stroke-linecap="round"/>

  <!-- Center Accent Dot -->
  <circle cx="256" cy="256" r="5" fill="#00f2fe"/>
</svg>
